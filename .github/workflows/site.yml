# site -- on each pull request and each push to main: the website of site/ is built with the
# toolchain that site/flake.lock pins, and its tests run. On main it is then published to GitHub
# Pages. The same check on a pull request and on main, so a fault is seen before it is merged.
name: site

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: cachix/install-nix-action@v31
      - name: the lock is current
        run: nix flake metadata --no-update-lock-file ./site >/dev/null
      - name: build the site and run its tests
        run: nix develop --no-update-lock-file ./site --command just _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
