# Vale: the prose rules of this repository as rules that can fail. Part of `just md-quality`.
# Taken from marola-dev/marola-research at 51fae22 (MIT, by the same author).
StylesPath = .vale/styles
MinAlertLevel = warning

[*.md]
BasedOnStyles = nashkell
# Not prose: HTML comments.
BlockIgnores = (?s)<!--.*?-->
# Not this repository's words: a quotation. A quoted source keeps its own adjectives. A quotation
# may go over a line end, and never over an empty line.
TokenIgnores = ("[^"\n]*(\n[^"\n]+)*"), (“[^”\n]*(\n[^”\n]+)*”)
